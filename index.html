<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alpha Life — the city</title>
<meta name="theme-color" content="#0D0A16">
<meta name="description" content="A stock-analysis game wrapped in a small drivable city. Process is scored separately from money.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alpha Life">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div class="splash on" id="splash">
  <div class="sp-inner">
    <div class="sp-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1>ALPHA LIFE</h1>
    <p class="sp-sub">Process is scored separately from money</p>
    <button class="sp-btn" id="splashBtn">Loading</button>
    <p class="sp-foot" id="splashFoot"></p>
  </div>
</div>


<div class="hud">
  <div class="pod">
    <div class="st tap" id="podPort">PORTFOLIO<b id="hPort">$10,000</b></div>
    <div class="st tap" id="podCash">CASH<b id="hCash">$2,000</b></div>
  </div>
  <div class="pod">
    <div class="st tap" id="podFocus">FOCUS<b id="hFocus">5</b></div>
    <div class="st tap" id="podSess">SESSIONS<b id="hSess">5</b></div>
    <div class="st">MONTH<b id="hMonth">1</b></div>
    <div class="st" id="podAum" style="display:none">FUND AUM<b id="hAum">$0</b></div>
    <button id="newBtn" title="Clear the save and start over">New game</button>
  </div>
</div>

<div class="prompt" id="prompt"></div>
<div class="toast" id="toast"></div>
<div class="moment" id="moment"></div>
<div class="termpop" id="termpop"></div>
<div id="stick"><div id="knob"></div></div>
<button id="actBtn">ENTER</button>

<button class="exit" id="exitBtn">Leave</button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/cars.js"></script>
<script src="js/housing.js"></script>
<script src="js/careers.js"></script>
<script src="js/social.js"></script>
<script src="js/activities.js"></script>
<script src="js/econ.js"></script>
<script src="js/state.js"></script>
<script src="js/art.js"></script>
<script src="js/city.js"></script>
<script src="js/rooms.js"></script>
<script src="js/endless.js"></script>
<script src="js/glossary.js"></script>
<script src="js/life.js"></script>
<script src="js/tutor.js"></script>
<script src="js/generate.js"></script>
<script src="js/instruments.js"></script>
<script src="js/market.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/fund.js"></script>
<script src="js/ledger.js"></script>
<script src="js/feel.js"></script>
<script src="js/boot.js"></script>
<script src="js/persist.js"></script>
<script src="js/shell.js"></script>

<!-- OPTIONAL ONLINE LAYER. Everything below is additive: js/config.js is
     gitignored and absent on a fresh clone, so its 404 is expected and
     harmless, ALPHA_CONFIG stays undefined, and every online feature switches
     itself off. The single-player game never touches the network. -->
<script src="js/vendor/obscenity.js"></script>
<script src="js/names.js"></script>
<script src="js/config.js"></script>
<script src="js/online.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/live.js"></script>

<!-- Developer testing aid, local only. Delete this line and js/devtools.js to remove. -->
<script src="js/devtools.js"></script>
</body>
</html>
