<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alpha Life — the city</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="game"><canvas id="cv"></canvas></div>

<div class="hud">
  <div class="pod">
    <div class="st">PORTFOLIO<b id="hPort">$10,000</b></div>
    <div class="st">CASH<b id="hCash">$2,000</b></div>
  </div>
  <div class="pod">
    <div class="st">FOCUS<b id="hFocus">5</b></div>
    <div class="st">SESSIONS<b id="hSess">5</b></div>
    <div class="st">MONTH<b id="hMonth">1</b></div>
    <button id="newBtn" title="Clear the save and start over">New game</button>
  </div>
</div>

<div class="prompt" id="prompt"></div>
<div class="toast" id="toast"></div>
<div id="stick"><div id="knob"></div></div>
<button id="actBtn">ENTER</button>

<button class="exit" id="exitBtn">Leave</button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/state.js"></script>
<script src="js/city.js"></script>
<script src="js/rooms.js"></script>
<script src="js/generate.js"></script>
<script src="js/market.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/ledger.js"></script>
<script src="js/boot.js"></script>
<script src="js/persist.js"></script>
</body>
</html>
